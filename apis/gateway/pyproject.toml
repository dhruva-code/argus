[project]
name = "argus-gateway"
version = "0.9.0-private"
description = "Argus platform REST/SSE API gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "redis>=5.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
    "sse-starlette>=2.1",
    "email-validator>=2.1",
    "psycopg[binary]>=3.2.10",
    "fpdf2>=2.8",
    "croniter>=3.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20", "ruff>=0.5"]
vault = ["hvac>=2.1"]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4"]
ignore = ["S101", "B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
