name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        working-directory: apis/gateway
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: apis/gateway
        run: ruff check app tests && ruff format --check app tests
      - name: Test
        working-directory: apis/gateway
        run: pytest -q

  orchestrator:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23.4" }
      - name: Vet
        working-directory: orchestrator
        run: test -z "$(gofmt -l .)" && go vet ./...
      - name: Test
        working-directory: orchestrator
        run: go test ./...

  scope-parity:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23.4" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cd orchestrator && go test ./internal/scope -run TestFixtureParity -v
      - run: cd apis/gateway && pip install -e ".[dev]" && pytest -q tests/test_scope_parity.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run typecheck && npm run lint
      - working-directory: web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # §37/§51/§53: local secret scanning before anything reaches the
  # repository's history. Runs on every push/PR, not just before a manual
  # push — catches a secret the moment it lands, not just at release time.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # §52: flags newly-introduced dependencies with known advisories on PRs.
  # Informational — does not auto-upgrade anything (see CHANGELOG.md).
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  # Validates every top-level/lib installer script parses cleanly and, where
  # shellcheck is available, lints it — catches quoting/unbound-variable/
  # portability mistakes before they reach a fresh install target.
  shell-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n syntax check
        run: |
          set -e
          for f in install.sh run.sh doctor.sh repair.sh update.sh scripts/*.sh scripts/lib/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done
      - name: shellcheck
        run: |
          shellcheck -S warning \
            install.sh run.sh doctor.sh repair.sh update.sh \
            scripts/*.sh scripts/lib/*.sh || true
        # informational for now (this codebase predates shellcheck adoption
        # in CI) — bash -n above is the hard gate; shellcheck warnings are
        # surfaced in the log without failing the build.

  # Applies the full alembic migration chain against a real, empty Postgres
  # from scratch — the same path a fresh install exercises — so a broken
  # migration (bad SQL, a missing down_revision link, a Postgres-only
  # statement with no SQLite/dialect guard) fails here, not on someone's
  # server.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U argus -d argus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        working-directory: apis/gateway
        run: pip install -e ".[dev]"
      - name: Migrate from scratch
        working-directory: apis/gateway
        env:
          DATABASE_URL: postgresql+psycopg://argus:argus@localhost:5432/argus
        run: alembic upgrade head
      - name: Verify head reached
        working-directory: apis/gateway
        env:
          DATABASE_URL: postgresql+psycopg://argus:argus@localhost:5432/argus
        run: |
          current="$(alembic current | awk '{print $1}')"
          head="$(alembic heads | awk '{print $1}')"
          echo "current=$current head=$head"
          test "$current" = "$head"
