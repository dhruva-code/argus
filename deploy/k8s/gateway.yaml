apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/argus-platform/gateway:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: argus-config }
            - secretRef: { name: argus-secrets }
      containers:
        - name: gateway
          image: ghcr.io/argus-platform/gateway:latest
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          envFrom:
            - configMapRef: { name: argus-config }
            - secretRef: { name: argus-secrets }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: gateway }
spec:
  selector: { app: gateway }
  ports: [{ port: 8000 }]
